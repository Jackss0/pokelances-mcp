name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MODEL_CACHE_DIR: ${{ github.workspace }}/.model-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: embeddings-multilingual-e5-base-q8
      - name: RAG retrieval eval (fails below 90% recall@3)
        run: npm run eval -- --min-recall3 0.9
